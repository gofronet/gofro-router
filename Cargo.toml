[workspace]
members = [
  "crates/gofro-agent",
  "crates/gofro-relay",
  "crates/gofro-server",
  "crates/wireguard-status",
]
resolver = "3"

[workspace.package]
version = "0.5.1"

edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
hickory-proto = "0.25"
idna = "1"
ipnet = "2"
prost = "0.14"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wireguard-status = { path = "crates/wireguard-status" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

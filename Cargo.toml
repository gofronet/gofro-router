[workspace]
members = [
  "crates/pi-agent",
  "crates/server",
  "crates/tunnel-core",
  "crates/updater",
  "crates/wg-relay",
]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun = "0.7"
tunnel-core = { path = "crates/tunnel-core" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build OpenWrt bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.85'
          components: rustfmt, clippy

      - name: Validate release
        run: |
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          VERSION=${GITHUB_REF_NAME#v}
          cargo metadata --no-deps --format-version 1 |
            jq -e --arg version "$VERSION" 'all(.packages[]; .version == $version)'

      - name: Test
        run: |
          cargo fmt --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          sh -n deploy/openwrt/install.sh \
            deploy/openwrt/root/etc/init.d/* \
            deploy/openwrt/root/etc/hotplug.d/iface/* \
            deploy/openwrt/root/usr/libexec/gofro/* \
            deploy/openwrt/root/usr/sbin/* \
            deploy/openwrt/tests/*.sh
          shellcheck -s sh deploy/openwrt/install.sh \
            deploy/openwrt/root/etc/init.d/* \
            deploy/openwrt/root/etc/hotplug.d/iface/* \
            deploy/openwrt/root/usr/libexec/gofro/* \
            deploy/openwrt/root/usr/sbin/* \
            deploy/openwrt/tests/*.sh
          sh deploy/openwrt/tests/mode.sh
          sh deploy/openwrt/tests/health.sh
          sh deploy/openwrt/tests/transaction.sh
          sh deploy/openwrt/tests/version.sh

      - name: Build web UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      - name: Download OpenWrt SDK
        env:
          SDK_FILE: openwrt-sdk-25.12.0-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          SDK_SHA256: 7e45a85b4af8af53ff17ca610ad6a7df312568cb52b730f93a21a91899f33139
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
          curl --fail --location --retry 3 \
            "https://downloads.openwrt.org/releases/25.12.0/targets/mediatek/filogic/$SDK_FILE" \
            -o "$RUNNER_TEMP/$SDK_FILE"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/$SDK_FILE" | sha256sum -c -
          tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/$SDK_FILE" -C "$RUNNER_TEMP"

      - name: Cross-compile static binaries
        run: |
          rustup target add aarch64-unknown-linux-musl
          TOOLCHAIN=$(printf '%s\n' "$RUNNER_TEMP"/openwrt-sdk-*/staging_dir/toolchain-aarch64_cortex-a53_gcc-*_musl)
          CC=$TOOLCHAIN/bin/aarch64-openwrt-linux-musl-gcc
          export CC_aarch64_unknown_linux_musl=$CC
          export AR_aarch64_unknown_linux_musl=$TOOLCHAIN/bin/aarch64-openwrt-linux-musl-gcc-ar
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=$CC
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS='-C target-cpu=cortex-a53 -C target-feature=+crt-static'
          export CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target/openwrt
          cargo build --locked --release --target aarch64-unknown-linux-musl \
            -p gofro-agent -p gofro-relay
          file target/openwrt/aarch64-unknown-linux-musl/release/gofro-agent | grep -q 'statically linked'
          file target/openwrt/aarch64-unknown-linux-musl/release/gofro-relay | grep -q 'statically linked'

      - name: Package bundle
        env:
          GEOSITE_VERSION: '20260824014107'
          GEOSITE_SHA256: f6ed069213b5cb087ebb2d60d0b086b5eb0de42b4de0eba90cbacc4790d6a78e
          GEOIP_VERSION: '202608050239'
          GEOIP_SHA256: c67bd077eb102cec74fab759b73d17f99275f56af10a87c14d9fd983508f5ce1
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          TARGET=aarch64-unknown-linux-musl
          ARCHIVE=gofro-router-aarch64-openwrt-linux-musl.tar.gz
          DIST=$RUNNER_TEMP/dist
          BUNDLE=$RUNNER_TEMP/bundle
          mkdir -p "$DIST" "$BUNDLE"
          cp -R deploy/openwrt/root deploy/openwrt/defaults "$BUNDLE/"
          install -m 755 deploy/openwrt/install.sh "$BUNDLE/install.sh"
          install -m 644 deploy/openwrt/update-public.pem "$BUNDLE/update-public.pem"
          printf '%s\n' "$VERSION" > "$BUNDLE/VERSION"
          install -D -m 755 "target/openwrt/$TARGET/release/gofro-agent" "$BUNDLE/root/usr/bin/gofro-agent"
          install -D -m 755 "target/openwrt/$TARGET/release/gofro-relay" "$BUNDLE/root/usr/bin/gofro-relay"
          install -D -m 644 GEODATA-LICENSES.md "$BUNDLE/root/usr/share/gofro/GEODATA-LICENSES.md"
          curl --fail --location --retry 3 \
            "https://github.com/v2fly/domain-list-community/releases/download/$GEOSITE_VERSION/dlc.dat" \
            -o "$BUNDLE/root/usr/share/gofro/geosite.dat"
          curl --fail --location --retry 3 \
            "https://github.com/v2fly/geoip/releases/download/$GEOIP_VERSION/geoip.dat" \
            -o "$BUNDLE/root/usr/share/gofro/geoip.dat"
          printf '%s  %s\n' "$GEOSITE_SHA256" "$BUNDLE/root/usr/share/gofro/geosite.dat" |
            sha256sum -c -
          printf '%s  %s\n' "$GEOIP_SHA256" "$BUNDLE/root/usr/share/gofro/geoip.dat" |
            sha256sum -c -
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          tar -C "$BUNDLE" --owner=0 --group=0 --numeric-owner \
            --mtime="@$SOURCE_DATE_EPOCH" -czf "$DIST/$ARCHIVE" \
            VERSION defaults install.sh root update-public.pem
          SHA=$(sha256sum "$DIST/$ARCHIVE" | cut -d ' ' -f1)
          jq -S -n --arg version "$VERSION" --arg archive "$ARCHIVE" --arg sha256 "$SHA" \
            '{schema: 1, version: $version, target: "aarch64-openwrt-linux-musl", archive: $archive, sha256: $sha256}' \
            > "$DIST/gofro-router-manifest.json"
          install -m 755 deploy/openwrt/root/usr/sbin/gofro-update "$DIST/gofro-install"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: signed-release-input
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: signed-release-input
          path: ${{ runner.temp }}/dist

      - name: Sign release
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -n $UPDATE_SIGNING_KEY ]]
          DIST=$RUNNER_TEMP/dist
          KEY=$RUNNER_TEMP/update-private.pem
          install -m 600 /dev/null "$KEY"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$UPDATE_SIGNING_KEY" > "$KEY"
          openssl pkeyutl -sign -inkey "$KEY" -rawin \
            -in "$DIST/gofro-router-manifest.json" \
            -out "$DIST/gofro-router-manifest.json.sig"
          openssl pkeyutl -verify -pubin -inkey deploy/openwrt/update-public.pem -rawin \
            -in "$DIST/gofro-router-manifest.json" \
            -sigfile "$DIST/gofro-router-manifest.json.sig"

      - name: Validate release assets
        run: |
          set -euo pipefail
          DIST=$RUNNER_TEMP/dist
          VERSION=${GITHUB_REF_NAME#v}
          ARCHIVE=$DIST/gofro-router-aarch64-openwrt-linux-musl.tar.gz
          MANIFEST=$DIST/gofro-router-manifest.json
          SHA=$(sha256sum "$ARCHIVE" | cut -d ' ' -f1)
          jq -e --arg version "$VERSION" --arg sha256 "$SHA" '
            type == "object" and
            keys == ["archive", "schema", "sha256", "target", "version"] and
            .schema == 1 and .version == $version and
            .target == "aarch64-openwrt-linux-musl" and
            .archive == "gofro-router-aarch64-openwrt-linux-musl.tar.gz" and
            .sha256 == $sha256
          ' "$MANIFEST"
          test -s "$DIST/gofro-install"
          MEMBERS=$(tar -tzf "$ARCHIVE")
          grep -qx VERSION <<< "$MEMBERS"
          grep -qx install.sh <<< "$MEMBERS"
          grep -qx root/usr/sbin/gofro-update <<< "$MEMBERS"

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIST=$RUNNER_TEMP/dist
          ASSETS=(
            "$DIST/gofro-router-aarch64-openwrt-linux-musl.tar.gz"
            "$DIST/gofro-router-manifest.json"
            "$DIST/gofro-router-manifest.json.sig"
            "$DIST/gofro-install"
          )
          if STATE=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ $STATE == true ]] || { echo 'published release already exists' >&2; exit 1; }
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --verify-tag --draft \
              --generate-notes --title "Gofro Router $GITHUB_REF_NAME"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build ARM64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.85'
          components: rustfmt, clippy

      - name: Validate release commit and version
        run: |
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          VERSION=${GITHUB_REF_NAME#v}
          cargo metadata --no-deps --format-version 1 |
            jq -e --arg version "$VERSION" 'all(.packages[]; .version == $version)'

      - name: Test Rust and shell
        run: |
          cargo fmt --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          bash -n deploy/pi/*.sh deploy/server/*.sh

      - name: Test and build web UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      - name: Build against Debian 12 ARM64 sysroot
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e CARGO_TARGET_DIR=/work/target/ci-arm64 \
            rust@sha256:e51d0265072d2d9d5d320f6a44dde6b9ef13653b035098febd68cce8fa7c0bc4 \
            sh -c 'rustup target add aarch64-unknown-linux-gnu && \
              apt-get update && apt-get install -y gcc-aarch64-linux-gnu && \
              CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
              cargo build --locked --release --target aarch64-unknown-linux-gnu \
                -p pi-agent -p wg-relay -p gofro-updater'

      - name: Package update
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          TARGET=aarch64-unknown-linux-gnu
          ARCHIVE=gofro-router-aarch64-unknown-linux-gnu.tar.gz
          DIST=$RUNNER_TEMP/dist
          BUNDLE=$RUNNER_TEMP/bundle
          install -d "$DIST" "$BUNDLE"
          install -m 755 "target/ci-arm64/$TARGET/release/pi-agent" "$BUNDLE/pi-agent"
          install -m 755 "target/ci-arm64/$TARGET/release/wg-relay" "$BUNDLE/wg-relay"
          install -m 755 "target/ci-arm64/$TARGET/release/gofro-updater" "$BUNDLE/gofro-updater"
          install -m 755 deploy/pi/migrate.sh "$BUNDLE/migrate.sh"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          tar -C "$BUNDLE" --owner=0 --group=0 --numeric-owner \
            --mtime="@$SOURCE_DATE_EPOCH" -czf "$DIST/$ARCHIVE" \
            pi-agent wg-relay gofro-updater migrate.sh
          SHA=$(sha256sum "$DIST/$ARCHIVE" | cut -d ' ' -f1)
          jq -S -n --arg version "$VERSION" --arg archive "$ARCHIVE" --arg sha256 "$SHA" \
            '{schema: 1, version: $version, target: "aarch64-unknown-linux-gnu", archive: $archive, sha256: $sha256}' \
            > "$DIST/gofro-router-manifest.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-input
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-input
          path: ${{ runner.temp }}/dist

      - name: Validate unsigned release input
        run: |
          set -euo pipefail
          DIST=$RUNNER_TEMP/dist
          VERSION=${GITHUB_REF_NAME#v}
          ARCHIVE=$DIST/gofro-router-aarch64-unknown-linux-gnu.tar.gz
          MANIFEST=$DIST/gofro-router-manifest.json
          shopt -s nullglob dotglob
          FILES=("$DIST"/*)
          [[ ${#FILES[@]} == 2 && -f $ARCHIVE && -f $MANIFEST ]]
          SHA=$(sha256sum "$ARCHIVE" | cut -d ' ' -f1)
          jq -e --arg version "$VERSION" --arg sha256 "$SHA" '
            type == "object" and
            keys == ["archive", "schema", "sha256", "target", "version"] and
            .schema == 1 and .version == $version and
            .target == "aarch64-unknown-linux-gnu" and
            .archive == "gofro-router-aarch64-unknown-linux-gnu.tar.gz" and
            .sha256 == $sha256
          ' "$MANIFEST"
          mapfile -t MEMBERS < <(tar -tzf "$ARCHIVE")
          [[ ${MEMBERS[*]} == "pi-agent wg-relay gofro-updater migrate.sh" ]]

      - name: Sign and verify manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -n $UPDATE_SIGNING_KEY ]]
          DIST=$RUNNER_TEMP/dist
          KEY=$RUNNER_TEMP/update-private.pem
          install -m 600 /dev/null "$KEY"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$UPDATE_SIGNING_KEY" > "$KEY"
          openssl pkeyutl -sign -inkey "$KEY" -rawin \
            -in "$DIST/gofro-router-manifest.json" \
            -out "$DIST/gofro-router-manifest.json.sig"
          openssl pkeyutl -verify -pubin -inkey deploy/pi/update-public.pem -rawin \
            -in "$DIST/gofro-router-manifest.json" \
            -sigfile "$DIST/gofro-router-manifest.json.sig"

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIST=$RUNNER_TEMP/dist
          ASSETS=(
            "$DIST/gofro-router-aarch64-unknown-linux-gnu.tar.gz"
            "$DIST/gofro-router-manifest.json"
            "$DIST/gofro-router-manifest.json.sig"
          )
          if STATE=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ $STATE == true ]] || { echo "published releases are immutable" >&2; exit 1; }
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --verify-tag --draft \
              --generate-notes --title "Gofro Router $GITHUB_REF_NAME"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false

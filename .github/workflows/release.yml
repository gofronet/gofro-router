name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy

      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ $GITHUB_REF == refs/heads/main ]] || { echo 'release must run from main' >&2; exit 1; }
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'version must be X.Y.Z' >&2; exit 1; }
          git fetch origin main --tags
          [[ $(git rev-parse origin/main) == "$GITHUB_SHA" ]] || { echo 'release must run from the latest main commit' >&2; exit 1; }
          TAG=v$VERSION
          TAG_EXISTS=false
          if TAG_SHA=$(git rev-parse --verify --quiet "$TAG^{commit}"); then
            [[ $TAG_SHA == "$GITHUB_SHA" ]] || { echo "$TAG points to another commit" >&2; exit 1; }
            TAG_EXISTS=true
          fi
          if STATE=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ $STATE == true ]] || { echo "$TAG is already published" >&2; exit 1; }
            [[ $TAG_EXISTS == true ]] || { echo "$TAG draft has no matching tag" >&2; exit 1; }
          fi
          cargo metadata --locked --no-deps --format-version 1 |
            jq -e --arg version "$VERSION" 'all(.packages[]; .version == $version)'

      - name: Test
        run: |
          cargo fmt --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          sh -n deploy/openwrt/install.sh \
            deploy/openwrt/root/etc/init.d/* \
            deploy/openwrt/root/etc/hotplug.d/iface/* \
            deploy/openwrt/root/usr/libexec/gofro/* \
            deploy/openwrt/root/usr/sbin/* \
            deploy/openwrt/tests/*.sh
          sh -n deploy/raspios/install.sh \
            deploy/raspios/root/usr/libexec/gofro/* \
            deploy/raspios/root/usr/sbin/* \
            deploy/raspios/tests/*.sh
          shellcheck -s sh deploy/openwrt/install.sh \
            deploy/openwrt/root/etc/init.d/* \
            deploy/openwrt/root/etc/hotplug.d/iface/* \
            deploy/openwrt/root/usr/libexec/gofro/* \
            deploy/openwrt/root/usr/sbin/* \
            deploy/openwrt/tests/*.sh
          shellcheck -s sh deploy/raspios/install.sh \
            deploy/raspios/root/usr/libexec/gofro/* \
            deploy/raspios/root/usr/sbin/* \
            deploy/raspios/tests/*.sh
          cmp deploy/openwrt/update-public.pem deploy/raspios/update-public.pem
          sh deploy/openwrt/tests/mode.sh
          sh deploy/openwrt/tests/health.sh
          sh deploy/openwrt/tests/hotplug.sh
          sh deploy/openwrt/tests/transaction.sh
          sh deploy/openwrt/tests/tunnel.sh
          sh deploy/openwrt/tests/update.sh
          sh deploy/openwrt/tests/version.sh
          sh deploy/openwrt/tests/wifi.sh
          sh deploy/raspios/tests/mode.sh
          sh deploy/raspios/tests/network.sh
          sh deploy/raspios/tests/recover.sh
          sh deploy/raspios/tests/transaction.sh
          sh deploy/raspios/tests/tunnel.sh
          sh deploy/raspios/tests/update.sh
          sh deploy/raspios/tests/version.sh
          sh deploy/raspios/tests/wifi.sh

      - name: Build web UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      - name: Install cross compiler
        env:
          ZIG_FILE: zig-x86_64-linux-0.15.2.tar.xz
          ZIG_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabi qemu-user
          curl --fail --location --retry 3 \
            "https://ziglang.org/download/0.15.2/$ZIG_FILE" -o "$RUNNER_TEMP/$ZIG_FILE"
          printf '%s  %s\n' "$ZIG_SHA256" "$RUNNER_TEMP/$ZIG_FILE" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$ZIG_FILE" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/${ZIG_FILE%.tar.xz}" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/${ZIG_FILE%.tar.xz}:$PATH"
          cargo install --locked --version 0.23.3 cargo-zigbuild

      - name: Cross-compile static binaries
        run: |
          set -euo pipefail
          targets=(
            aarch64-unknown-linux-musl
            armv5te-unknown-linux-musleabi
            arm-unknown-linux-musleabihf
            armv7-unknown-linux-musleabi
            armv7-unknown-linux-musleabihf
            i586-unknown-linux-musl
            riscv64gc-unknown-linux-musl
            x86_64-unknown-linux-musl
          )
          rustup target add "${targets[@]}"
          export CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target/openwrt
          ARMV5_LIBGCC=$(arm-linux-gnueabi-gcc -print-libgcc-file-name)
          export CARGO_TARGET_ARMV5TE_UNKNOWN_LINUX_MUSLEABI_RUSTFLAGS="-C target-cpu=arm926ej-s -C link-arg=$ARMV5_LIBGCC"
          ARMV7_SOFT_CPU=generic+v7a+thumb2+soft_float+strict_align
          export CFLAGS_armv7_unknown_linux_musleabi="-mcpu=$ARMV7_SOFT_CPU"
          export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABI_RUSTFLAGS="-C link-arg=-mcpu=$ARMV7_SOFT_CPU"
          for target in "${targets[@]}"; do
            cargo zigbuild --locked --release \
              --target "$target" -p gofro-agent -p gofro-relay
            for binary in gofro-agent gofro-relay; do
              path="target/openwrt/$target/release/$binary"
              if readelf -l "$path" | grep -q INTERP; then
                echo "$path has a dynamic interpreter" >&2
                exit 1
              fi
              if readelf -d "$path" | grep -q NEEDED; then
                echo "$path has dynamic dependencies" >&2
                exit 1
              fi
            done
          done
          readelf -h target/openwrt/armv7-unknown-linux-musleabi/release/gofro-agent |
            grep -q 'soft-float ABI'
          readelf -h target/openwrt/armv7-unknown-linux-musleabihf/release/gofro-agent |
            grep -q 'hard-float ABI'
          readelf -A target/openwrt/armv5te-unknown-linux-musleabi/release/gofro-agent |
            grep -q 'Tag_CPU_arch: v5TE'
          readelf -A target/openwrt/arm-unknown-linux-musleabihf/release/gofro-agent |
            grep -q 'Tag_CPU_arch: v6'
          readelf -A target/openwrt/armv7-unknown-linux-musleabi/release/gofro-agent |
            grep -q 'Tag_CPU_arch: v7'
          run_versions() {
            local runner=$1 cpu=$2 target=$3
            for binary in gofro-agent gofro-relay; do
              "$runner" -cpu "$cpu" "target/openwrt/$target/release/$binary" --version
            done
          }
          run_versions qemu-aarch64 cortex-a53 aarch64-unknown-linux-musl
          run_versions qemu-arm arm926 armv5te-unknown-linux-musleabi
          run_versions qemu-arm arm1176 arm-unknown-linux-musleabihf
          run_versions qemu-arm cortex-a7 armv7-unknown-linux-musleabi
          run_versions qemu-arm cortex-a7 armv7-unknown-linux-musleabihf
          run_versions qemu-i386 pentium i586-unknown-linux-musl
          run_versions qemu-riscv64 rv64 riscv64gc-unknown-linux-musl
          for binary in gofro-agent gofro-relay; do
            "target/openwrt/x86_64-unknown-linux-musl/release/$binary" --version
          done

      - name: Package bundle
        env:
          GEOSITE_VERSION: '20260824014107'
          GEOSITE_SHA256: f6ed069213b5cb087ebb2d60d0b086b5eb0de42b4de0eba90cbacc4790d6a78e
          GEOIP_VERSION: '202608050239'
          GEOIP_SHA256: c67bd077eb102cec74fab759b73d17f99275f56af10a87c14d9fd983508f5ce1
        run: |
          set -euo pipefail
          DIST=$RUNNER_TEMP/dist
          GEODATA=$RUNNER_TEMP/geodata
          mkdir -p "$DIST" "$GEODATA"
          curl --fail --location --retry 3 \
            "https://github.com/v2fly/domain-list-community/releases/download/$GEOSITE_VERSION/dlc.dat" \
            -o "$GEODATA/geosite.dat"
          curl --fail --location --retry 3 \
            "https://github.com/v2fly/geoip/releases/download/$GEOIP_VERSION/geoip.dat" \
            -o "$GEODATA/geoip.dat"
          printf '%s  %s\n' "$GEOSITE_SHA256" "$GEODATA/geosite.dat" |
            sha256sum -c -
          printf '%s  %s\n' "$GEOIP_SHA256" "$GEODATA/geoip.dat" |
            sha256sum -c -
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")

          package() {
            local rust_target=$1 release_target=$2 manifest=$3 platform=$4
            local archive="gofro-router-$release_target.tar.gz"
            local bundle="$RUNNER_TEMP/bundle-$release_target"
            mkdir -p "$bundle"
            cp -R "deploy/$platform/root" "deploy/$platform/defaults" "$bundle/"
            install -m 755 "deploy/$platform/install.sh" "$bundle/install.sh"
            install -m 644 "deploy/$platform/update-public.pem" "$bundle/update-public.pem"
            printf '%s\n' "$VERSION" > "$bundle/VERSION"
            printf '%s\n' "$release_target" > "$bundle/TARGET"
            install -D -m 755 "target/openwrt/$rust_target/release/gofro-agent" "$bundle/root/usr/bin/gofro-agent"
            install -D -m 755 "target/openwrt/$rust_target/release/gofro-relay" "$bundle/root/usr/bin/gofro-relay"
            install -D -m 644 GEODATA-LICENSES.md "$bundle/root/usr/share/gofro/GEODATA-LICENSES.md"
            install -m 644 "$GEODATA/geosite.dat" "$bundle/root/usr/share/gofro/geosite.dat"
            install -m 644 "$GEODATA/geoip.dat" "$bundle/root/usr/share/gofro/geoip.dat"
            tar -C "$bundle" --owner=0 --group=0 --numeric-owner \
              --mtime="@$SOURCE_DATE_EPOCH" -czf "$DIST/$archive" \
              TARGET VERSION defaults install.sh root update-public.pem
            local sha
            sha=$(sha256sum "$DIST/$archive" | cut -d ' ' -f1)
            jq -S -n --arg version "$VERSION" --arg target "$release_target" \
              --arg archive "$archive" --arg sha256 "$sha" \
              '{schema: 1, version: $version, target: $target, archive: $archive, sha256: $sha256}' \
              > "$DIST/$manifest"
          }
          while read -r rust_target release_target manifest platform; do
            package "$rust_target" "$release_target" "$manifest" "$platform"
          done <<'EOF'
          aarch64-unknown-linux-musl aarch64-openwrt-linux-musl gofro-router-manifest.json openwrt
          armv5te-unknown-linux-musleabi armv5te-openwrt-linux-musleabi gofro-router-manifest-armv5te-openwrt-linux-musleabi.json openwrt
          arm-unknown-linux-musleabihf armv6-openwrt-linux-musleabihf gofro-router-manifest-armv6-openwrt-linux-musleabihf.json openwrt
          armv7-unknown-linux-musleabi armv7-openwrt-linux-musleabi gofro-router-manifest-armv7-openwrt-linux-musleabi.json openwrt
          armv7-unknown-linux-musleabihf armv7-openwrt-linux-musleabihf gofro-router-manifest-armv7-openwrt-linux-musleabihf.json openwrt
          i586-unknown-linux-musl i586-openwrt-linux-musl gofro-router-manifest-i586-openwrt-linux-musl.json openwrt
          riscv64gc-unknown-linux-musl riscv64-openwrt-linux-musl gofro-router-manifest-riscv64-openwrt-linux-musl.json openwrt
          x86_64-unknown-linux-musl x86_64-openwrt-linux-musl gofro-router-manifest-x86_64-openwrt-linux-musl.json openwrt
          aarch64-unknown-linux-musl aarch64-raspios-linux-musl gofro-router-manifest-aarch64-raspios-linux-musl.json raspios
          EOF
          install -m 755 deploy/openwrt/root/usr/sbin/gofro-update "$DIST/gofro-install"
          install -m 755 deploy/raspios/root/usr/sbin/gofro-update "$DIST/gofro-install-raspios"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: signed-release-input
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: signed-release-input
          path: ${{ runner.temp }}/dist

      - name: Sign release
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -n $UPDATE_SIGNING_KEY ]]
          DIST=$RUNNER_TEMP/dist
          KEY=$RUNNER_TEMP/update-private.pem
          install -m 600 /dev/null "$KEY"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$UPDATE_SIGNING_KEY" > "$KEY"
          for manifest in "$DIST"/gofro-router-manifest*.json; do
            openssl pkeyutl -sign -inkey "$KEY" -rawin \
              -in "$manifest" -out "$manifest.sig"
            openssl pkeyutl -verify -pubin -inkey deploy/openwrt/update-public.pem -rawin \
              -in "$manifest" -sigfile "$manifest.sig"
          done

      - name: Validate release assets
        run: |
          set -euo pipefail
          DIST=$RUNNER_TEMP/dist
          validate() {
            local target=$1 manifest=$2
            local archive="gofro-router-$target.tar.gz"
            local sha
            sha=$(sha256sum "$DIST/$archive" | cut -d ' ' -f1)
            jq -e --arg version "$VERSION" --arg target "$target" \
              --arg archive "$archive" --arg sha256 "$sha" '
                type == "object" and
                keys == ["archive", "schema", "sha256", "target", "version"] and
                .schema == 1 and .version == $version and .target == $target and
                .archive == $archive and .sha256 == $sha256
              ' "$DIST/$manifest"
            local members
            members=$(tar -tzf "$DIST/$archive")
            grep -qx TARGET <<< "$members"
            grep -qx VERSION <<< "$members"
            grep -qx install.sh <<< "$members"
            grep -qx root/usr/sbin/gofro-update <<< "$members"
            [[ $(tar -xOzf "$DIST/$archive" TARGET) == "$target" ]]
          }
          for manifest in "$DIST"/gofro-router-manifest*.json; do
            validate "$(jq -r .target "$manifest")" "$(basename "$manifest")"
          done
          test -s "$DIST/gofro-install"
          test -s "$DIST/gofro-install-raspios"

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v$VERSION
          git fetch origin main --tags
          [[ $(git rev-parse origin/main) == "$GITHUB_SHA" ]] || { echo 'main advanced during the build; rerun the release' >&2; exit 1; }
          if TAG_SHA=$(git rev-parse --verify --quiet "$TAG^{commit}"); then
            [[ $TAG_SHA == "$GITHUB_SHA" ]] || { echo "$TAG points to another commit" >&2; exit 1; }
          else
            # ponytail: GitHub has no atomic compare-and-tag API; create immediately after the main check.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIST=$RUNNER_TEMP/dist
          TAG=v$VERSION
          ASSETS=("$DIST"/gofro-router-*.tar.gz "$DIST"/gofro-router-manifest*.json \
            "$DIST"/gofro-router-manifest*.json.sig "$DIST/gofro-install" \
            "$DIST/gofro-install-raspios")
          if STATE=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ $STATE == true ]] || { echo 'published release already exists' >&2; exit 1; }
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" "${ASSETS[@]}" --verify-tag --draft \
            --generate-notes --title "Gofro Router $TAG"
          gh release edit "$TAG" --draft=false

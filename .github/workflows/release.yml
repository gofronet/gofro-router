name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string
      publish:
        description: Publish after hardware qualification and exact artifact hash comparison
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy

      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ $GITHUB_REF == refs/heads/main ]] || { echo 'release must run from main' >&2; exit 1; }
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'version must be X.Y.Z' >&2; exit 1; }
          git fetch origin main --tags
          [[ $(git rev-parse origin/main) == "$GITHUB_SHA" ]] || { echo 'release must run from the latest main commit' >&2; exit 1; }
          TAG=v$VERSION
          TAG_EXISTS=false
          if TAG_SHA=$(git rev-parse --verify --quiet "$TAG^{commit}"); then
            [[ $TAG_SHA == "$GITHUB_SHA" ]] || { echo "$TAG points to another commit" >&2; exit 1; }
            TAG_EXISTS=true
          fi
          if STATE=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ $STATE == true ]] || { echo "$TAG is already published" >&2; exit 1; }
            [[ $TAG_EXISTS == true ]] || { echo "$TAG draft has no matching tag" >&2; exit 1; }
          fi
          cargo metadata --locked --no-deps --format-version 1 |
            jq -e --arg version "$VERSION" 'all(.packages[]; .version == $version)'

      - name: Test
        run: |
          cargo fmt --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for file in deploy/openwrt/install.sh \
            deploy/openwrt/root/etc/init.d/* \
            deploy/openwrt/root/etc/hotplug.d/iface/* \
            deploy/openwrt/root/usr/libexec/gofro/* \
            deploy/openwrt/root/usr/sbin/* \
            deploy/openwrt/tests/*.sh deploy/openwrt/tests/fixtures/*; do
            sh -n "$file"
          done
          shellcheck -s sh deploy/openwrt/install.sh \
            deploy/openwrt/root/etc/init.d/* \
            deploy/openwrt/root/etc/hotplug.d/iface/* \
            deploy/openwrt/root/usr/libexec/gofro/* \
            deploy/openwrt/root/usr/sbin/* \
            deploy/openwrt/tests/*.sh deploy/openwrt/tests/fixtures/*
          cmp deploy/openwrt/update-public.pem deploy/server/update-public.pem
          sh deploy/openwrt/tests/mode.sh
          sh deploy/openwrt/tests/service.sh
          sh deploy/openwrt/tests/health.sh
          sh deploy/openwrt/tests/hotplug.sh
          sh deploy/openwrt/tests/guard.sh
          sh deploy/openwrt/tests/network.sh
          sh deploy/openwrt/tests/transaction.sh
          sh deploy/openwrt/tests/tunnel.sh
          sh deploy/openwrt/tests/update.sh
          sh deploy/openwrt/tests/version.sh
          sh deploy/openwrt/tests/wifi.sh
          sh deploy/openwrt/tests/onboarding.sh
          sh deploy/openwrt/tests/install-output.sh
          for file in deploy/server/*.sh deploy/server/gofro-managed deploy/server/gofro-server-install deploy/server/tests/*.sh; do
            bash -n "$file"
          done
          shellcheck -s bash deploy/server/*.sh deploy/server/gofro-managed deploy/server/gofro-server-install deploy/server/tests/*.sh
          bash deploy/server/tests/version.sh
          bash deploy/server/tests/managed.sh
          cargo build --locked -p gofro-agent --bin gofro-agent
          FIXTURES=$(mktemp -d)
          export FIXTURES
          trap 'rm -rf "$FIXTURES"' EXIT
          bash deploy/openwrt/tests/dataplane-netns.sh --emit-only
          sudo -n docker build -t gofro-native-test -f deploy/openwrt/tests/Dockerfile deploy/openwrt/tests
          sudo -n docker build -t gofro-mode-test - <<'EOF'
          FROM gofro-native-test
          RUN apt-get update && apt-get install -y --no-install-recommends procps
          EOF
          # sysctl runs under ip netns exec: mount proc only in that owned namespace.
          sudo -n docker run --rm --network none --user 0:0 \
            --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$FIXTURES:/fixtures:ro" \
            -e FIXTURES=/fixtures -w /src gofro-mode-test sh -eu -c '
              printf "#!/bin/sh\nset -eu\nmount -t proc -o nosuid,nodev,noexec proc /proc\nexec /sbin/sysctl \"\$@\"\n" > /usr/local/bin/sysctl
              chmod +x /usr/local/bin/sysctl
              exec sh deploy/openwrt/tests/dataplane-netns.sh --run
            '
          sudo -n docker run --rm --network none --cap-add NET_ADMIN --user 0:0 \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src gofro-mode-test \
            sh deploy/openwrt/tests/mode-netns.sh --run
          # Nested ip netns needs mount/setns privileges, never host networking.
          sudo -n docker run --rm --network none --user 0:0 \
            --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$FIXTURES:/fixtures:ro" \
            -e AGENT_BIN=/src/target/debug/gofro-agent -e FIXTURES=/fixtures \
            -w /src gofro-mode-test sh deploy/openwrt/tests/dns-netns.sh
          sudo -n docker run --rm --network none --user 0:0 \
            --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src gofro-mode-test \
            sh deploy/openwrt/tests/exclusions-netns.sh
          sudo -n docker run --rm --network none --user 0:0 \
            --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src gofro-mode-test \
            sh deploy/openwrt/tests/lifecycle-netns.sh
          sudo -n docker run --rm --network none --user 0:0 \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src gofro-mode-test \
            sh deploy/openwrt/tests/panel.sh

      - name: Build web UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test
          bun run build

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-web-assets
          path: assets
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv5te-unknown-linux-musleabi
          - arm-unknown-linux-musleabihf
          - armv7-unknown-linux-musleabi
          - armv7-unknown-linux-musleabihf
          - i586-unknown-linux-musl
          - riscv64gc-unknown-linux-musl
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-web-assets
          path: assets
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}

      - name: Install cross compiler
        env:
          ZIG_FILE: zig-x86_64-linux-0.15.2.tar.xz
          ZIG_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabi qemu-user
          curl --fail --location --retry 3 \
            "https://ziglang.org/download/0.15.2/$ZIG_FILE" -o "$RUNNER_TEMP/$ZIG_FILE"
          printf '%s  %s\n' "$ZIG_SHA256" "$RUNNER_TEMP/$ZIG_FILE" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$ZIG_FILE" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/${ZIG_FILE%.tar.xz}" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/${ZIG_FILE%.tar.xz}:$PATH"
          cargo install --locked --version 0.23.3 cargo-zigbuild

      - name: Cross-compile static binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target/openwrt
          ARMV5_LIBGCC=$(arm-linux-gnueabi-gcc -print-libgcc-file-name)
          export CARGO_TARGET_ARMV5TE_UNKNOWN_LINUX_MUSLEABI_RUSTFLAGS="-C target-cpu=arm926ej-s -C link-arg=$ARMV5_LIBGCC"
          ARMV7_SOFT_CPU=generic+v7a+thumb2+soft_float+strict_align
          export CFLAGS_armv7_unknown_linux_musleabi="-mcpu=$ARMV7_SOFT_CPU"
          export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABI_RUSTFLAGS="-C link-arg=-mcpu=$ARMV7_SOFT_CPU"
          if [[ $TARGET == arm* || $TARGET == i586-* ]]; then
            # ponytail: use OpenSSL's pthread fallback until Zig supplies 32-bit __atomic_is_lock_free.
            cflags=CFLAGS_${TARGET//-/_}
            export "$cflags=${!cflags:-} -DBROKEN_CLANG_ATOMICS"
          fi
          cargo zigbuild --locked --release \
            --target "$TARGET" -p gofro-agent -p gofro-relay
          if [[ $TARGET == x86_64-unknown-linux-musl ]]; then
            cargo zigbuild --locked --release --target "$TARGET" -p gofro-server
          fi
          for binary in gofro-agent gofro-relay; do
            path="target/openwrt/$TARGET/release/$binary"
            if readelf -l "$path" | grep -q INTERP; then
              echo "$path has a dynamic interpreter" >&2
              exit 1
            fi
            if readelf -d "$path" | grep -q NEEDED; then
              echo "$path has dynamic dependencies" >&2
              exit 1
            fi
          done
          if [[ $TARGET == x86_64-unknown-linux-musl ]]; then
            path=target/openwrt/$TARGET/release/gofro-server
            if readelf -l "$path" | grep -q INTERP; then exit 1; fi
            if readelf -d "$path" | grep -q NEEDED; then exit 1; fi
            "$path" --version
          fi
          path="target/openwrt/$TARGET/release/gofro-agent"
          case "$TARGET" in
            armv5te-unknown-linux-musleabi)
              readelf -A "$path" | grep -q 'Tag_CPU_arch: v5TE'
              runner=qemu-arm cpu=arm926 ;;
            arm-unknown-linux-musleabihf)
              readelf -A "$path" | grep -q 'Tag_CPU_arch: v6'
              runner=qemu-arm cpu=arm1176 ;;
            armv7-unknown-linux-musleabi)
              readelf -h "$path" | grep -q 'soft-float ABI'
              readelf -A "$path" | grep -q 'Tag_CPU_arch: v7'
              runner=qemu-arm cpu=cortex-a7 ;;
            armv7-unknown-linux-musleabihf)
              readelf -h "$path" | grep -q 'hard-float ABI'
              runner=qemu-arm cpu=cortex-a7 ;;
            aarch64-unknown-linux-musl) runner=qemu-aarch64 cpu=cortex-a53 ;;
            i586-unknown-linux-musl) runner=qemu-i386 cpu=pentium ;;
            riscv64gc-unknown-linux-musl) runner=qemu-riscv64 cpu=rv64 ;;
            x86_64-unknown-linux-musl) runner='' cpu='' ;;
          esac
          for binary in gofro-agent gofro-relay; do
            path="target/openwrt/$TARGET/release/$binary"
            if [[ -n $runner ]]; then
              "$runner" -cpu "$cpu" "$path" --version
            else
              "$path" --version
            fi
          done
          security=$(mktemp -d)
          agent=("target/openwrt/$TARGET/release/gofro-agent" --init-security
            --tls-cert "$security/cert.pem" --tls-key "$security/key.pem")
          if [[ -n $runner ]]; then agent=("$runner" -cpu "$cpu" "${agent[@]}"); fi
          fingerprint=$("${agent[@]}")
          [[ -n $fingerprint && $("${agent[@]}") == "$fingerprint" ]]
          rm -rf "$security"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-binaries-${{ matrix.target }}
          path: |
            target/openwrt/${{ matrix.target }}/release/gofro-agent
            target/openwrt/${{ matrix.target }}/release/gofro-relay
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: matrix.target == 'x86_64-unknown-linux-musl'
        with:
          name: release-server-${{ matrix.target }}
          path: target/openwrt/${{ matrix.target }}/release/gofro-server
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package release bundles
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-binaries-*
          path: ${{ runner.temp }}/binaries

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-server-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/binaries/release-server-x86_64-unknown-linux-musl

      - name: Package bundle
        env:
          GEOSITE_VERSION: '20260824014107'
          GEOSITE_SHA256: f6ed069213b5cb087ebb2d60d0b086b5eb0de42b4de0eba90cbacc4790d6a78e
          GEOIP_VERSION: '202608050239'
          GEOIP_SHA256: c67bd077eb102cec74fab759b73d17f99275f56af10a87c14d9fd983508f5ce1
        run: |
          set -euo pipefail
          DIST=$RUNNER_TEMP/dist
          GEODATA=$RUNNER_TEMP/geodata
          BINARIES=$RUNNER_TEMP/binaries
          mkdir -p "$DIST" "$GEODATA"
          curl --fail --location --retry 3 \
            "https://github.com/v2fly/domain-list-community/releases/download/$GEOSITE_VERSION/dlc.dat" \
            -o "$GEODATA/geosite.dat"
          curl --fail --location --retry 3 \
            "https://github.com/v2fly/geoip/releases/download/$GEOIP_VERSION/geoip.dat" \
            -o "$GEODATA/geoip.dat"
          printf '%s  %s\n' "$GEOSITE_SHA256" "$GEODATA/geosite.dat" |
            sha256sum -c -
          printf '%s  %s\n' "$GEOIP_SHA256" "$GEODATA/geoip.dat" |
            sha256sum -c -
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")

          package() {
            local rust_target=$1 release_target=$2 manifest=$3 platform=$4
            local archive="gofro-router-$release_target.tar.gz"
            local bundle="$RUNNER_TEMP/bundle-$release_target"
            mkdir -p "$bundle"
            if [[ $platform == server ]]; then
              install -D -m 755 deploy/server/gofro-server-install "$bundle/root/usr/local/sbin/gofro-server-install"
              install -D -m 755 deploy/server/gofro-managed "$bundle/root/usr/local/sbin/gofro-managed"
              install -D -m 755 "$BINARIES/release-server-$rust_target/gofro-server" "$bundle/root/usr/local/bin/gofro-router-server"
              install -D -m 755 "$BINARIES/release-binaries-$rust_target/gofro-relay" "$bundle/root/usr/local/bin/gofro-relay"
            else
              cp -R "deploy/$platform/root" "deploy/$platform/defaults" "$bundle/"
              install -D -m 755 "$BINARIES/release-binaries-$rust_target/gofro-agent" "$bundle/root/usr/bin/gofro-agent"
              install -D -m 755 "$BINARIES/release-binaries-$rust_target/gofro-relay" "$bundle/root/usr/bin/gofro-relay"
              install -D -m 644 GEODATA-LICENSES.md "$bundle/root/usr/share/gofro/GEODATA-LICENSES.md"
              install -m 644 "$GEODATA/geosite.dat" "$bundle/root/usr/share/gofro/geosite.dat"
              install -m 644 "$GEODATA/geoip.dat" "$bundle/root/usr/share/gofro/geoip.dat"
            fi
            install -m 755 "deploy/$platform/install.sh" "$bundle/install.sh"
            install -m 644 "deploy/$platform/update-public.pem" "$bundle/update-public.pem"
            printf '%s\n' "$VERSION" > "$bundle/VERSION"
            printf '%s\n' "$release_target" > "$bundle/TARGET"
            local members=(TARGET VERSION install.sh root update-public.pem)
            [[ $platform == server ]] || members+=(defaults)
            tar -C "$bundle" --owner=0 --group=0 --numeric-owner \
              --mtime="@$SOURCE_DATE_EPOCH" -czf "$DIST/$archive" \
              "${members[@]}"
            local sha
            sha=$(sha256sum "$DIST/$archive" | cut -d ' ' -f1)
            jq -S -n --arg version "$VERSION" --arg target "$release_target" \
              --arg archive "$archive" --arg sha256 "$sha" \
              '{schema: 1, version: $version, target: $target, archive: $archive, sha256: $sha256}' \
              > "$DIST/$manifest"
          }
          while read -r rust_target release_target manifest platform; do
            package "$rust_target" "$release_target" "$manifest" "$platform"
          done <<'EOF'
          aarch64-unknown-linux-musl aarch64-openwrt-linux-musl gofro-router-manifest.json openwrt
          armv5te-unknown-linux-musleabi armv5te-openwrt-linux-musleabi gofro-router-manifest-armv5te-openwrt-linux-musleabi.json openwrt
          arm-unknown-linux-musleabihf armv6-openwrt-linux-musleabihf gofro-router-manifest-armv6-openwrt-linux-musleabihf.json openwrt
          armv7-unknown-linux-musleabi armv7-openwrt-linux-musleabi gofro-router-manifest-armv7-openwrt-linux-musleabi.json openwrt
          armv7-unknown-linux-musleabihf armv7-openwrt-linux-musleabihf gofro-router-manifest-armv7-openwrt-linux-musleabihf.json openwrt
          i586-unknown-linux-musl i586-openwrt-linux-musl gofro-router-manifest-i586-openwrt-linux-musl.json openwrt
          riscv64gc-unknown-linux-musl riscv64-openwrt-linux-musl gofro-router-manifest-riscv64-openwrt-linux-musl.json openwrt
          x86_64-unknown-linux-musl x86_64-openwrt-linux-musl gofro-router-manifest-x86_64-openwrt-linux-musl.json openwrt
          x86_64-unknown-linux-musl x86_64-server-linux-musl gofro-router-manifest-x86_64-server-linux-musl.json server
          EOF
          install -m 755 deploy/openwrt/root/usr/sbin/gofro-update "$DIST/gofro-install"
          install -m 755 deploy/server/gofro-server-install "$DIST/gofro-server-install"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: signed-release-input
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign candidate
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: signed-release-input
          path: ${{ runner.temp }}/dist

      - name: Sign release
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -n $UPDATE_SIGNING_KEY ]]
          DIST=$RUNNER_TEMP/dist
          KEY=$RUNNER_TEMP/update-private.pem
          install -m 600 /dev/null "$KEY"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$UPDATE_SIGNING_KEY" > "$KEY"
          for manifest in "$DIST"/gofro-router-manifest*.json; do
            openssl pkeyutl -sign -inkey "$KEY" -rawin \
              -in "$manifest" -out "$manifest.sig"
            openssl pkeyutl -verify -pubin -inkey deploy/openwrt/update-public.pem -rawin \
              -in "$manifest" -sigfile "$manifest.sig"
          done

      - name: Validate release assets
        run: |
          set -euo pipefail
          DIST=$RUNNER_TEMP/dist
          validate() {
            local target=$1 manifest=$2
            local archive="gofro-router-$target.tar.gz"
            local sha
            sha=$(sha256sum "$DIST/$archive" | cut -d ' ' -f1)
            jq -e --arg version "$VERSION" --arg target "$target" \
              --arg archive "$archive" --arg sha256 "$sha" '
                type == "object" and
                keys == ["archive", "schema", "sha256", "target", "version"] and
                .schema == 1 and .version == $version and .target == $target and
                .archive == $archive and .sha256 == $sha256
              ' "$DIST/$manifest"
            local members
            members=$(tar -tzf "$DIST/$archive")
            grep -qx TARGET <<< "$members"
            grep -qx VERSION <<< "$members"
            grep -qx install.sh <<< "$members"
            grep -qx update-public.pem <<< "$members"
            if [[ $target == x86_64-server-linux-musl ]]; then
              grep -qx root/usr/local/bin/gofro-router-server <<< "$members"
              grep -qx root/usr/local/bin/gofro-relay <<< "$members"
              grep -qx root/usr/local/sbin/gofro-server-install <<< "$members"
              grep -qx root/usr/local/sbin/gofro-managed <<< "$members"
            else
              grep -qx root/usr/sbin/gofro-update <<< "$members"
            fi
            [[ $(tar -xOzf "$DIST/$archive" TARGET) == "$target" ]]
          }
          for manifest in "$DIST"/gofro-router-manifest*.json; do
            validate "$(jq -r .target "$manifest")" "$(basename "$manifest")"
          done
          test -s "$DIST/gofro-install"
          test -s "$DIST/gofro-server-install"

      - name: Record candidate inventory
        working-directory: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          archives=(gofro-router-*.tar.gz)
          manifests=(gofro-router-manifest*.json)
          signatures=(gofro-router-manifest*.json.sig)
          files=(*)
          [[ ${#archives[@]} == 9 && ${#manifests[@]} == 9 && ${#signatures[@]} == 9 && ${#files[@]} == 29 ]]
          sha256sum -- "${files[@]}" | jq -Rn \
            --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" '
              {version: $version, commit: $commit, run_id: $run_id, run_attempt: $run_attempt,
               assets: [inputs | capture("^(?<sha256>[0-9a-f]{64})  (?<name>.+)$")]}
            ' > "$RUNNER_TEMP/release-metadata.json"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: signed-release-v${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: signed-release-metadata-v${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-metadata.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish qualified candidate
    if: inputs.publish == true
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: signed-release-v${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/dist

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v$VERSION
          git fetch origin main --tags
          [[ $(git rev-parse origin/main) == "$GITHUB_SHA" ]] || { echo 'main advanced during the build; rerun the release' >&2; exit 1; }
          if TAG_SHA=$(git rev-parse --verify --quiet "$TAG^{commit}"); then
            [[ $TAG_SHA == "$GITHUB_SHA" ]] || { echo "$TAG points to another commit" >&2; exit 1; }
          else
            # ponytail: GitHub has no atomic compare-and-tag API; create immediately after the main check.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIST=$RUNNER_TEMP/dist
          TAG=v$VERSION
          ASSETS=("$DIST"/gofro-router-*.tar.gz "$DIST"/gofro-router-manifest*.json \
            "$DIST"/gofro-router-manifest*.json.sig "$DIST/gofro-install" \
            "$DIST/gofro-server-install")
          if STATE=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ $STATE == true ]] || { echo 'published release already exists' >&2; exit 1; }
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" "${ASSETS[@]}" --verify-tag --draft \
            --generate-notes --title "Gofro Router $TAG"
          gh release edit "$TAG" --draft=false

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: test "$(find ../assets -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" = "$(printf 'app.css\napp.js\nindex.html')"
      - run: test -z "$(git status --porcelain --untracked-files=all -- ../assets)"

  shell:
    name: Shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: |
          bash -n deploy/server/*.sh
          sh -n deploy/openwrt/install.sh \
            deploy/openwrt/root/etc/init.d/* \
            deploy/openwrt/root/etc/hotplug.d/iface/* \
            deploy/openwrt/root/usr/libexec/gofro/* \
            deploy/openwrt/root/usr/sbin/* \
            deploy/openwrt/tests/*.sh
          shellcheck -s sh deploy/openwrt/install.sh \
            deploy/openwrt/root/etc/init.d/* \
            deploy/openwrt/root/etc/hotplug.d/iface/* \
            deploy/openwrt/root/usr/libexec/gofro/* \
            deploy/openwrt/root/usr/sbin/* \
            deploy/openwrt/tests/*.sh
          sh deploy/openwrt/tests/health.sh
          sh deploy/openwrt/tests/mode.sh
          sh deploy/openwrt/tests/transaction.sh
          sh deploy/openwrt/tests/update.sh
          sh deploy/openwrt/tests/version.sh
          sh deploy/openwrt/tests/wifi.sh
          python3 deploy/openwrt/tests/geodata_filter.py

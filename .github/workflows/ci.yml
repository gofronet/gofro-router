name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Dataplane, mode and actual DNS namespace tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 nftables python3
          cargo build --locked -p gofro-agent --bin gofro-agent
          FIXTURES=$(mktemp -d)
          export FIXTURES
          trap 'rm -rf "$FIXTURES"' EXIT
          bash deploy/openwrt/tests/dataplane-netns.sh
          sudo -n docker build -t gofro-mode-test - <<'EOF'
          FROM debian:trixie-slim
          RUN apt-get update && apt-get install -y --no-install-recommends iproute2 nftables python3
          EOF
          sudo -n docker run --rm --network none --cap-add NET_ADMIN --user 0:0 \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src gofro-mode-test \
            sh deploy/openwrt/tests/mode-netns.sh --run
          # Nested ip netns needs mount/setns privileges, never host networking.
          sudo -n docker run --rm --network none --user 0:0 \
            --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$FIXTURES:/fixtures:ro" \
            -e AGENT_BIN=/src/target/debug/gofro-agent -e FIXTURES=/fixtures \
            -w /src gofro-mode-test sh deploy/openwrt/tests/dns-netns.sh

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: gzip -cd ../assets/app.js.gz | cmp - ../assets/app.js && gzip -cd ../assets/app.css.gz | cmp - ../assets/app.css && gzip -cd ../assets/chart.js.gz | cmp - ../assets/chart.js
      - run: test "$(sha256sum ../assets/app.js | cut -d ' ' -f1)" = "$(< ../assets/app.js.sha256)" && test "$(sha256sum ../assets/app.css | cut -d ' ' -f1)" = "$(< ../assets/app.css.sha256)" && test "$(sha256sum ../assets/chart.js | cut -d ' ' -f1)" = "$(< ../assets/chart.js.sha256)"
      - run: bun run build
      - run: test "$(find ../assets -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" = "$(printf 'app.css\napp.css.gz\napp.css.sha256\napp.js\napp.js.gz\napp.js.sha256\nchart.js\nchart.js.gz\nchart.js.sha256\nindex.html')"
      - run: gzip -cd ../assets/app.js.gz | cmp - ../assets/app.js && gzip -cd ../assets/app.css.gz | cmp - ../assets/app.css && gzip -cd ../assets/chart.js.gz | cmp - ../assets/chart.js
      - run: test "$(sha256sum ../assets/app.js | cut -d ' ' -f1)" = "$(< ../assets/app.js.sha256)" && test "$(sha256sum ../assets/app.css | cut -d ' ' -f1)" = "$(< ../assets/app.css.sha256)" && test "$(sha256sum ../assets/chart.js | cut -d ' ' -f1)" = "$(< ../assets/chart.js.sha256)"

  shell:
    name: Shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: |
          for file in deploy/server/*.sh deploy/server/gofro-managed deploy/server/gofro-server-install deploy/server/tests/*.sh; do
            bash -n "$file"
          done
          shellcheck -s bash deploy/server/*.sh deploy/server/gofro-managed deploy/server/gofro-server-install deploy/server/tests/*.sh
          bash deploy/server/tests/version.sh
          bash deploy/server/tests/managed.sh
          for file in deploy/openwrt/install.sh \
            deploy/openwrt/root/etc/init.d/* \
            deploy/openwrt/root/etc/hotplug.d/iface/* \
            deploy/openwrt/root/usr/libexec/gofro/* \
            deploy/openwrt/root/usr/sbin/* \
            deploy/openwrt/tests/*.sh deploy/openwrt/tests/fixtures/*; do
            sh -n "$file"
          done
          shellcheck -s sh deploy/openwrt/install.sh \
            deploy/openwrt/root/etc/init.d/* \
            deploy/openwrt/root/etc/hotplug.d/iface/* \
            deploy/openwrt/root/usr/libexec/gofro/* \
            deploy/openwrt/root/usr/sbin/* \
            deploy/openwrt/tests/*.sh deploy/openwrt/tests/fixtures/*
          cmp deploy/openwrt/update-public.pem deploy/server/update-public.pem
          sh deploy/openwrt/tests/health.sh
          sh deploy/openwrt/tests/hotplug.sh
          sh deploy/openwrt/tests/guard.sh
          sh deploy/openwrt/tests/network.sh
          sh deploy/openwrt/tests/mode.sh
          sh deploy/openwrt/tests/service.sh
          sh deploy/openwrt/tests/transaction.sh
          sh deploy/openwrt/tests/tunnel.sh
          sh deploy/openwrt/tests/update.sh
          sh deploy/openwrt/tests/version.sh
          sh deploy/openwrt/tests/wifi.sh
          sh deploy/openwrt/tests/onboarding.sh
          sh deploy/openwrt/tests/install-output.sh
